name: Test Notify Unresolved Action

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  test-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Test notify-unresolved-threads-action
        uses: kreuz123/notify-unresolved-threads-action@v1
        id: notify
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wait-seconds: 10
      
      - name: Check outputs
        run: |
          echo "Reviewer: ${{ steps.notify.outputs.reviewer }}"
          echo "Unresolved Count: ${{ steps.notify.outputs.unresolvedCount }}"
          echo "Thread List: ${{ steps.notify.outputs.threadList }}"
